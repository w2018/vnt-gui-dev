name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download vnt-cli sidecar
        run: |
          $VERSION = "v1.2.17"
          Invoke-WebRequest -Uri "https://github.com/vnt-dev/vnt/releases/download/$VERSION/vnt-cli-x86_64-pc-windows-msvc.zip" -OutFile "src-tauri/binaries/vnt-cli.zip"
          Expand-Archive -Path "src-tauri/binaries/vnt-cli.zip" -DestinationPath "src-tauri/binaries/" -Force
          Move-Item -Path "src-tauri/binaries/vnt-cli-x86_64-pc-windows-msvc.exe" -Destination "src-tauri/binaries/vnt-cli-x86_64-pc-windows-msvc.exe" -Force

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VNT-GUI-Windows
          path: src-tauri/target/release/bundle/**/*.exe
